<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ČD / PID Informační Maker</title>
    <style>
        :root {
            --cd-orange: #f36f21;
            --pid-bg: #d8d3c9;
            --panel-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --border-color: #38383a;
            --accent-blue: #0a84ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #f2f2f7;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #1c1c1e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--cd-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .preview-area {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .form-control {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            color: #a1a1a6;
            text-transform: uppercase;
        }

        input[type="text"], select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--cd-orange);
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stop-card {
            background: #2c2c2e;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #3a3a3c;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .btn-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ff453a;
            color: white;
            border: none;
            border-radius: 4px;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            background: var(--cd-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-add {
            background: #30d158;
            color: #000;
            padding: 6px 10px;
            font-size: 11px;
        }

        canvas {
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border-radius: 4px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<header>
    <h1>ČD & PID Tabulkový Generator</h1>
    <button class="btn" onclick="exportJPG()">Exportovat JPG</button>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="form-control">
            <label for="trainLine">Linka / Typ Vlaku (ČD):</label>
            <input type="text" id="trainLine" value="S41 / Sp 1708">
        </div>

        <div class="row-2">
            <div class="form-control">
                <label for="destination">Cílová stanice:</label>
                <input type="text" id="destination" value="Praha-Masarykovo n.">
            </div>
            <div class="form-control">
                <label for="mainZone">Hlavní Pásmo PID:</label>
                <input type="text" id="mainZone" value="P">
            </div>
        </div>

        <div class="form-control">
            <label for="viaRoute">Nácestná trasa (přes):</label>
            <input type="text" id="viaRoute" value="Kralupy n.Vlt. – Roztoky u Prahy">
        </div>

        <hr style="border-color: var(--border-color); margin: 4px 0;">

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Nácestné stanice (PID Mřížka):</label>
            <button class="btn btn-add" onclick="addStop()">+ Přidat</button>
        </div>

        <div id="stopsList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div class="preview-area">
        <canvas id="makerCanvas" width="1000" height="700"></canvas>
    </div>
</div>

<script>
const canvas = document.getElementById('makerCanvas');
const ctx = canvas.getContext('2d');

let stops = [
    { name: "Kralupy n.Vlt.", zone: "5" },
    { name: "Libčice n.Vlt.", zone: "4" },
    { name: "Řež", zone: "3" },
    { name: "Roztoky u Prahy", zone: "2" },
    { name: "Praha-Podbaba", zone: "0" },
    { name: "Praha-Holešovice", zone: "P" }
];

function initStopsUI() {
    const container = document.getElementById('stopsList');
    container.innerHTML = '';
    
    stops.forEach((stop, index) => {
        const card = document.createElement('div');
        card.className = 'stop-card';
        card.innerHTML = `
            <button class="btn-remove" onclick="removeStop(${index})">✕</button>
            <div class="row-2">
                <div class="form-control">
                    <label>Stanice:</label>
                    <input type="text" value="${stop.name}" oninput="updateStop(${index}, 'name', this.value)">
                </div>
                <div class="form-control">
                    <label>Pásmo:</label>
                    <input type="text" value="${stop.zone}" oninput="updateStop(${index}, 'zone', this.value)">
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function addStop() {
    stops.push({ name: "Nová Stanice", zone: "1" });
    initStopsUI();
    draw();
}

function removeStop(index) {
    stops.splice(index, 1);
    initStopsUI();
    draw();
}

function updateStop(index, field, val) {
    stops[index][field] = val;
    draw();
}

function drawCDLogo(ctx, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 8;
    ctx.lineJoin = "round";

    // Symbol loga ČD
    ctx.beginPath();
    ctx.arc(25, 25, 20, Math.PI * 0.25, Math.PI * 1.75, false);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(25, 5);
    ctx.lineTo(55, 5);
    ctx.lineTo(55, 45);
    ctx.lineTo(25, 45);
    ctx.stroke();

    ctx.restore();
}

function draw() {
    const w = canvas.width;
    const h = canvas.height;

    // 1. Pozadí PID (Pískovo-šedá podle druhotných obrázků)
    ctx.fillStyle = "#d8d3c9";
    ctx.fillRect(0, 0, w, h);

    // 2. ČD Oranžový Hlavní Banner
    const bannerH = 150;
    ctx.fillStyle = "#f36f21";
    ctx.fillRect(0, 0, w, bannerH);

    // Logo ČD vpravo nahoře
    drawCDLogo(ctx, w - 90, 20, 1.1);

    // Texty Vlaku a Cíle
    const trainLine = document.getElementById('trainLine').value;
    const destination = document.getElementById('destination').value;
    const mainZone = document.getElementById('mainZone').value;
    const viaRoute = document.getElementById('viaRoute').value;

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 32px sans-serif";
    ctx.fillText(trainLine, 30, 50);

    ctx.font = "bold 46px sans-serif";
    ctx.fillText(destination, 30, 105);

    ctx.font = "italic 18px sans-serif";
    ctx.fillText("přes: " + viaRoute, 30, 133);

    // 3. Ikona Hlavního Pásma PID (Kolečko)
    if (mainZone.trim() !== "") {
        const circleX = w - 140;
        const circleY = 85;
        const radius = 30;

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(mainZone, circleX, circleY);
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
    }

    // 4. Mřížka Zastávek PID (Bílé zaoblené bloky)
    const startY = bannerH + 25;
    const padding = 12;
    const cols = 3;
    const blockW = (w - 40 - (padding * (cols - 1))) / cols;
    const blockH = 100;

    stops.forEach((stop, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);

        const x = 20 + col * (blockW + padding);
        const y = startY + row * (blockH + padding);

        // Bílý blok
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.roundRect(x, y, blockW, blockH, 10);
        ctx.fill();

        // Název stanice
        ctx.fillStyle = "#000000";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(stop.name, x + 15, y + 42);

        // Zóna PID vpravo dole v bloku
        if (stop.zone) {
            ctx.fillStyle = "#555555";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText("Pásmo " + stop.zone, x + 15, y + 75);

            // Malé kroužkové logo pásma PID
            const miniCircleX = x + blockW - 25;
            const miniCircleY = y + 68;
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(miniCircleX, miniCircleY, 12, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(stop.zone, miniCircleX, miniCircleY);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
        }
    });
}

function exportJPG() {
    const a = document.createElement('a');
    a.download = 'CD_PID_Tabule.jpg';
    a.href = canvas.toDataURL('image/jpeg', 0.95);
    a.click();
}

['trainLine', 'destination', 'mainZone', 'viaRoute'].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
});

window.onload = () => {
    initStopsUI();
    draw();
};
</script>

</body>
</html>
